name: Kino aktualisieren

on:
  schedule:
    - cron: "15 3 * * *"    # taeglich ca. 05:15 Uhr Suedtirol-Zeit
    - cron: "15 12 * * 3,4" # Mittwoch/Donnerstag zusaetzlich mittags (neue Kinowoche)
  workflow_dispatch:         # zum manuellen Starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kinoprogramm holen
        run: python update_kino.py
      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add kino_suedtirol.json kino_cache.json kino_report.txt
          git diff --cached --quiet || (git commit -m "Kino aktualisiert" && git push)
