name: Events aktualisieren

on:
  schedule:
    - cron: "40 3 * * *"   # taeglich ca. 05:40 Uhr Suedtirol-Zeit
  workflow_dispatch:        # zum manuellen Starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Events holen
        run: python update_events.py
      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add events_south_tyrol.json events_dauer.json events_report.txt
          git diff --cached --quiet || (git commit -m "Events aktualisiert" && git push)
