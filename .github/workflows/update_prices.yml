name: Tägliche Spritpreis-Aktualisierung

on:
  schedule:
    # Zweimal täglich (UTC), damit auch im Winter die 8-Uhr-Preise des Ministeriums schon da sind
    - cron: '35 6 * * *'
    - cron: '35 9 * * *'
  workflow_dispatch: # Ermöglicht es, das Skript jederzeit manuell per Klick zu testen

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Spritpreise abrufen und filtern
        run: python fetch_prices.py

      - name: Änderungen im Repository speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add spritpreise_bz.json spritpreise_stand.json
          git diff --staged --quiet || (git commit -m "Auto-Update Spritpreise Südtirol" && git pull --rebase && git push)
